<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#10151e"><title>付款额度</title><style>body{background:#10151e;color:#e5eaf3;font:15px system-ui;margin:40px auto;max-width:1100px;padding:20px}h1{font-size:30px}small,p{color:#9aa9bf}button,input,select{background:#232e40;color:inherit;border:1px solid #42516a;border-radius:8px;padding:10px;margin:4px}button{cursor:pointer}button:hover{background:#345071}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.card,section{background:#192231;border:1px solid #2c394c;border-radius:14px;padding:20px;margin:14px 0}.num{font-size:40px;color:#72e2bc}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #334055}dialog{background:#192231;color:white;border:1px solid #566;border-radius:14px}label{display:block;margin:8px} .scroll{overflow:auto;max-height:450px}@media(max-width:600px){body{margin:0;padding:16px 10px}.grid{grid-template-columns:1fr}button,input,select{font-size:16px;min-height:44px}section,.card{padding:15px}td,th{white-space:nowrap}dialog{max-width:88%}} 
body{margin:16px auto;padding:14px;max-width:1100px}h1{font-size:24px;margin:8px 0}h1 small{font-size:12px}body>p{font-size:12px;line-height:1.6;margin:10px 0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}.card{padding:12px;margin:0;border-radius:10px;position:relative}.card h2{font-size:15px;margin:0 0 5px}.num{font-size:26px;font-weight:650}.card p{font-size:11px;margin:5px 0;line-height:1.4}.card label{display:inline-block;font-size:11px;margin:2px 4px 0 0}.card input{font-size:12px!important;min-height:0!important;padding:4px;margin:2px;width:34px!important}.card details{font-size:11px;color:#aab9cd;margin-top:6px}.card summary{cursor:pointer}section{margin:12px 0;padding:14px}section h2{font-size:19px;margin:0 0 8px}section p{font-size:12px}.scroll{max-height:520px}th{position:sticky;top:0;background:#223047;z-index:1}td,th{padding:9px 10px;font-size:13px}td:first-child,th:first-child{position:sticky;left:0;background:#192231;z-index:2}th:first-child{z-index:3}button,input,select{padding:8px}button{font-size:13px}@media(max-width:600px){body{padding:12px 8px;margin:0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.card{padding:10px}.card h2{font-size:14px}.card p{font-size:10px}.num{font-size:25px}section{padding:12px 8px}button{font-size:13px;min-height:40px}td,th{padding:8px;font-size:12px}}
.forecast-picker{display:none}.forecast-mobile{display:none}@media(max-width:600px){.forecast-picker{display:flex;align-items:center;gap:8px;margin:8px 0}.forecast-picker select{flex:1;min-width:0;font-size:16px}.forecast-desktop{display:none}.forecast-mobile{display:table;table-layout:fixed;width:100%}.forecast-mobile th,.forecast-mobile td{white-space:normal;text-align:center;padding:10px 6px}.forecast-mobile td:first-child,.forecast-mobile th:first-child{text-align:left}.forecast-mobile .available{color:#72e2bc;font-weight:650;font-size:16px}} .forecast-tabs{display:flex;gap:6px;margin:10px 0}.forecast-tabs button{flex:1;margin:0;padding:8px 4px;min-height:40px;border-radius:9px;font-size:14px}.forecast-tabs button.active{background:#245b50;color:#a9ffe1;border-color:#5cbf9e}.forecast-overview{table-layout:fixed;width:100%;min-width:0}.forecast-overview th,.forecast-overview td{padding:9px 3px;text-align:center;white-space:normal;overflow-wrap:anywhere}.forecast-overview th:first-child,.forecast-overview td:first-child{width:42px;text-align:left}.forecast-overview th{font-size:11px;line-height:1.5}.forecast-overview td{font-size:14px}.forecast-overview tbody tr:nth-child(even){background:#1e293a}@media(max-width:600px){.forecast-overview th{font-size:10px}.forecast-overview td{font-size:13px}.forecast-overview th:first-child,.forecast-overview td:first-child{width:36px}} </style><h1>付款额度 <small>手机本地版</small></h1><p>成功、失败、退款均占1次。退款请修改原付款状态，勿重复录入。同一笔付款只记录一次。Safari 分享 → 添加到主屏幕。历史数据请点击“恢复备份”导入。</p><div><button onclick="edit()">＋ 录入付款 / 历史补录</button><button onclick="backup()">导出备份</button><button onclick="csv()">导出CSV</button><button onclick="document.querySelector('#file').click()">恢复备份</button><input hidden type=file id=file accept=".json"><span hidden><select id=mode><option value=days>严格超过30自然日</option></select></span></div><p>严格规则：付款日期加31天零点释放；满30天当天仍占次数。以北京时间计算。手机清除网站数据会丢失记录，请定期备份。设备时区：<span id=zone></span></p><div class=grid id=cards></div><section><h2>未来30天预测</h2><p>假设不再新增付款；显示每日零点时可付次数，同时受每日及30天额度限制。</p><div class="forecast-tabs" role="group" aria-label="预测渠道分类"><button type="button" onclick="setForecastGroup('全部')">全部</button><button type="button" onclick="setForecastGroup('支付宝')">支付宝</button><button type="button" onclick="setForecastGroup('京东')">京东</button><button type="button" onclick="setForecastGroup('微信')">微信</button></div><div class=scroll id=forecast></div></section><section><h2>付款记录</h2><div class=scroll id=records></div></section><dialog id=dlg><form id=form><h2>付款记录</h2><label>渠道 <select id=channel></select></label><label>付款时间 <input required type=datetime-local id=when></label><label>状态 <select id=status><option>成功</option><option>失败</option><option>退款</option><option>待确认</option></select></label><label>备注 <input id=note maxlength=200></label><p>超限仍允许保存真实历史记录，并显示警告。</p><button>保存</button><button type=button onclick="dlg.close()">取消</button></form></dialog><script>
const key='payment-quota-strict-v2', names=['支付宝-183','支付宝130','支付宝qq','微信','京东183','京东130'];let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}s=s||{mode:'days',channels:names.map((name,i)=>({id:String(i),name,limit:4,daily:2})),records:[]};let forecastGroup='全部';function setForecastGroup(group){forecastGroup=group;render()}let editing=null;const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function start(t){let d=new Date(t+8*3600000);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-8*3600000}function add(t,n){return t+n*86400000}function release(r){return add(start(r.time),31)}function stats(c,t){let rs=s.records.filter(r=>r.channel===c.id&&r.time<=t),used=rs.filter(r=>release(r)>t).length,today=rs.filter(r=>start(r.time)===start(t)).length;return {used,today,left:Math.max(0,Math.min(c.limit-used,c.daily-today)),next:rs.map(release).filter(x=>x>t).sort((a,b)=>a-b)[0]}}function fmt(t){return t?new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'—'}function save(){s.mode="days";try{localStorage.setItem(key,JSON.stringify(s))}catch{alert('保存失败，请立即导出备份。')}render()}function render(){let now=Date.now();$('mode').value=s.mode;$('zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;$('cards').innerHTML=s.channels.map((c,i)=>{let a=stats(c,now);return `<div class=card><h2>${esc(c.name)}</h2><span class=num>${a.left}</span> 今日可付<p>今日 ${a.today}/${c.daily} · 30天 ${a.used}/${c.limit}${a.today>c.daily||a.used>c.limit?' · ⚠ 已超限':''}</p><p>下次滚动释放：${fmt(a.next)}</p><details><summary>调整限额</summary><label>30天上限 <input style="width:60px" type=number min=1 value=${c.limit} onchange="limit(${i},'limit',this)"></label><label>每日上限 <input style="width:60px" type=number min=1 value=${c.daily} onchange="limit(${i},'daily',this)"></label></details></div>`}).join('');$('records').innerHTML='<table><tr><th>时间</th><th>渠道</th><th>状态 / 备注</th><th>操作</th></tr>'+[...s.records].sort((a,b)=>b.time-a.time).map(r=>`<tr><td>${fmt(r.time)}</td><td>${esc(s.channels.find(c=>c.id===r.channel)?.name||'')}</td><td>${esc(r.status)} ${esc(r.note||'')}</td><td><button onclick="edit('${r.id}')">修改</button><button onclick="remove('${r.id}')">删除</button></td></tr>`).join('')+'</table>';let channels=s.channels.filter(c=>forecastGroup==='全部'||c.name.startsWith(forecastGroup));document.querySelectorAll('.forecast-tabs button').forEach(b=>{let active=b.textContent===forecastGroup;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});let dates=Array.from({length:30},(_,i)=>add(start(now),i+1));$('forecast').innerHTML='<table class="forecast-overview"><thead><tr><th>日期</th>'+channels.map(c=>'<th>'+esc(c.name)+'</th>').join('')+'</tr></thead><tbody>'+dates.map(t=>'<tr><td>'+new Date(t).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric'})+'</td>'+channels.map(c=>'<td>'+stats(c,t).left+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function limit(i,k,input){let n=Number(input.value);if(!Number.isSafeInteger(n)||n<1){alert('请输入正整数');render();return}s.channels[i][k]=n;save()}function edit(id){editing=id||null;let r=s.records.find(r=>r.id===id);$('channel').innerHTML=s.channels.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('channel').value=r?.channel||s.channels[0].id;let d=new Date(r?.time||Date.now());$('when').value=new Date(+d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('status').value=r?.status||'成功';$('note').value=r?.note||'';$('dlg').showModal()}$('form').onsubmit=e=>{e.preventDefault();let time=+new Date($('when').value);if(!Number.isFinite(time)||time>Date.now()){alert('请输入有效的过去或当前时间');return}let r={id:editing||crypto.randomUUID(),channel:$('channel').value,time,status:$('status').value,note:$('note').value};s.records=s.records.filter(x=>x.id!==editing);s.records.push(r);save();$('dlg').close();let c=s.channels.find(c=>c.id===r.channel),a=stats(c,time);if(a.used>c.limit||a.today>c.daily)alert('已保存真实记录：该付款时间已超限，请停止继续付款。')};function remove(id){if(confirm('删除这笔记录？删除后额度会重新计算。')){s.records=s.records.filter(r=>r.id!==id);save()}}function download(text,name,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download(JSON.stringify(s,null,2),'付款额度备份.json','application/json')}function csv(){let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('\ufeff'+[['时间','渠道','状态','备注'],...s.records.map(r=>[fmt(r.time),s.channels.find(c=>c.id===r.channel)?.name,r.status,r.note])].map(row=>row.map(q).join(',')).join('\r\n'),'付款记录.csv','text/csv')}$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!['days','exact'].includes(v.mode)||!Array.isArray(v.channels)||!v.channels.length||!Array.isArray(v.records)||v.channels.some(c=>typeof c.id!=='string'||typeof c.name!=='string'||!Number.isSafeInteger(c.limit)||c.limit<1||!Number.isSafeInteger(c.daily)||c.daily<1)||v.records.some(r=>typeof r.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(r.id)||!Number.isFinite(r.time)||!v.channels.some(c=>c.id===r.channel)||!['成功','失败','退款','待确认'].includes(r.status)))throw Error();if(confirm('恢复将替换当前全部数据，建议先导出备份。继续？')){v.mode='days';s=v;save()}}catch{alert('备份文件无效')}e.target.value=''};render();setInterval(render,30000);window.onfocus=render;
</script></html>
