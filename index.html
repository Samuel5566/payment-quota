.forecast-ranges{display:flex;gap:6px;margin:10px 0 12px;padding:4px;border-radius:11px;background:#101925}.forecast-ranges button{flex:1;margin:0;background:transparent;border:1px solid transparent;font-size:13px;min-height:38px;padding:7px 4px}.forecast-ranges button.active{background:#2c4057;border-color:#4a6685;color:#eef6ff}.forecast-ranges button:hover{background:#26384e}.title-row,.channel-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.title-row h1{overflow-wrap:anywhere;min-width:0}.title-edit{flex:none;font-size:11px;color:#a8bbd2;background:transparent;border-color:#34445c;padding:5px 8px;min-height:32px}.channel-heading{margin-top:18px}.channel-heading h2{font-size:16px;margin:0}.channel-heading button{font-size:12px;margin:0}.title-row{margin-bottom:8px}#channelDialog input{max-width:190px}#channelDialog{max-width:88%;box-sizing:border-box}#channelDialog p{font-size:12px}.record-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}.summary-item{background:#111d2a;border:1px solid #2f4055;border-radius:10px;padding:12px;min-width:0}.summary-item>span{display:block;color:#9db0c7;font-size:12px}.summary-item strong{display:block;font-size:23px;color:#edf5ff;margin:7px 0}.summary-item small{font-size:11px;color:#8dddc0;overflow-wrap:anywhere}.summary-item:nth-child(2){border-top:2px solid #e8c46e}.summary-item:nth-child(3){border-top:2px solid #78e2b2}.summary-item:nth-child(4){border-top:2px solid #b79ae0}.summary-hint{grid-column:1/-1;margin:2px 0!important;font-size:11px!important;line-height:1.5}@media(max-width:600px){.record-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.summary-item{padding:10px}.summary-item strong{font-size:21px}}</style><div class="title-row"><h1 id="appTitle">付款额度</h1><button class="title-edit" type="button" onclick="editTitle()" aria-label="修改标题">✎ 修改标题</button></div><p>已完成、失败、退款均占1次；未打款不占次数。退款请修改原付款状态，勿重复录入。同一笔付款只记录一次。Safari 分享 → 添加到主屏幕。历史数据请点击“恢复备份”导入。</p><div><button onclick="edit()">＋ 录入付款 / 历史补录</button><button onclick="backup()">导出备份</button><button onclick="csv()">导出CSV</button><button onclick="document.querySelector('#file').click()">恢复备份</button><input hidden type=file id=file accept=".json"><span hidden><select id=mode><option value=days>严格超过30自然日</option></select></span></div><p>严格规则：付款日期加31天零点释放；满30天当天仍占次数。以北京时间计算。手机清除网站数据会丢失记录，请定期备份。设备时区：<span id=zone></span></p><div class="channel-heading"><h2>渠道总览</h2><button type="button" onclick="addChannel()">＋ 添加渠道</button></div><div class=grid id=cards></div><section><h2>额度预测</h2><div class="forecast-ranges" role="group" aria-label="预测天数"><button type="button" onclick="setForecastDays(10)">未来10天</button><button type="button" onclick="setForecastDays(20)">未来20天</button><button type="button" onclick="setForecastDays(30)">未来30天</button></div><p>假设不再新增付款；显示每日零点时可付次数，同时受每日及30天额度限制。</p><div class="forecast-tabs" role="group" aria-label="预测渠道分类"><button type="button" onclick="setForecastGroup('全部')">全部</button><button type="button" onclick="setForecastGroup('支付宝')">支付宝</button><button type="button" onclick="setForecastGroup('京东')">京东</button><button type="button" onclick="setForecastGroup('微信')">微信</button></div><div class=scroll id=forecast></div></section><section><h2>付款记录</h2><div id="recordSummary" class="record-summary"></div><div class="status-legend"><span class="status-pill status-done"><i class="status-dot"></i>已完成</span><span class="status-pill status-pending"><i class="status-dot"></i>未打款</span><span class="status-pill status-failed"><i class="status-dot"></i>失败</span><span class="status-pill status-refund"><i class="status-dot"></i>退款</span></div><div class=scroll id=records></div></section><dialog id="channelDialog"><form id="channelForm"><h2>添加渠道</h2><label>渠道名称 <input id="newChannelName" required maxlength="30" placeholder="例如：支付宝新渠道"></label><label>每日上限 <input id="newChannelDaily" type="number" min="1" step="1" value="2" required></label><label>滚动上限 <input id="newChannelLimit" type="number" min="1" step="1" value="4" required></label><p>沿用严格超过30自然日的释放规则。</p><button type="submit">添加</button><button type="button" onclick="document.getElementById('channelDialog').close()">取消</button></form></dialog><dialog id=dlg><form id=form><h2>付款记录</h2><label>渠道 <select id=channel></select></label><label>付款时间 <input required type=datetime-local id=when></label><label>状态 <select id=status><option>已完成</option><option>失败</option><option>退款</option><option>未打款</option></select></label><label>金额（元，可留空） <input id="amount" type="number" min="0" step="0.01" placeholder="例如9834"></label><label>备注 <input id=note maxlength=200></label><p>超限仍允许保存真实历史记录，并显示警告。</p><button>保存</button><button type=button onclick="dlg.close()">取消</button></form></dialog><script>
const key='payment-quota-strict-v2', names=['支付宝-183','支付宝130','支付宝qq','微信','京东183','京东130'];let s;try{s=JSON.parse(localStorage.getItem(key))}catch{}s=s||{mode:'days',channels:names.map((name,i)=>({id:String(i),name,limit:4,daily:2})),records:[]};let forecastDays=10;function setForecastDays(days){forecastDays=days;render()}let forecastGroup='全部';function setForecastGroup(group){forecastGroup=group;render()}let editing=null;const $=id=>document.getElementById(id),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function start(t){let d=new Date(t+8*3600000);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-8*3600000}function add(t,n){return t+n*86400000}function release(r){return add(start(r.time),31)}function stats(c,t){let rs=s.records.filter(r=>r.status!=='未打款'&&r.channel===c.id&&r.time<=t),used=rs.filter(r=>release(r)>t).length,today=rs.filter(r=>start(r.time)===start(t)).length;return {used,today,left:Math.max(0,Math.min(c.limit-used,c.daily-today)),next:rs.map(release).filter(x=>x>t).sort((a,b)=>a-b)[0]}}function editTitle(){let value=prompt('设置页面标题（最多30字）',s.title||'付款额度');if(value===null)return;value=value.trim();if(!value||value.length>30){alert('请输入1至30字的标题');return}s.title=value;save()}function addChannel(){$('channelForm').reset();$('channelDialog').showModal()}$('channelForm').onsubmit=e=>{e.preventDefault();let name=$('newChannelName').value.trim(),daily=Number($('newChannelDaily').value),limit=Number($('newChannelLimit').value);if(!name||name.length>30||!Number.isSafeInteger(daily)||daily<1||!Number.isSafeInteger(limit)||limit<1){alert('请填写渠道名称及正整数上限');return}if(s.channels.some(c=>c.name===name)){alert('这个渠道名称已存在');return}s.channels.push({id:crypto.randomUUID(),name,daily,limit});save();$('channelDialog').close()};function statusBadge(status){let kind=({'已完成':'done','未打款':'pending','失败':'failed','退款':'refund'})[status]||'pending';return '<span class="status-pill status-'+kind+'"><i class="status-dot" aria-hidden="true"></i>'+esc(status)+'</span>'}function money(n){return '¥'+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}function renderRecordSummary(){let all=s.records,unpaid=all.filter(r=>r.status==='未打款'),paid=all.filter(r=>r.status==='已完成'||r.status==='退款'),refund=all.filter(r=>r.status==='退款'),sum=rs=>rs.reduce((n,r)=>n+(Number.isFinite(r.amount)?Math.round(r.amount*100):0),0)/100,unknown=rs=>rs.filter(r=>!Number.isFinite(r.amount)).length;let items=[['全部记录',all.length+' 笔','含失败、退款和未打款'],['未打款',unpaid.length+' 笔',money(sum(unpaid))],['累计打款',paid.length+' 笔',money(sum(paid))+' · 含退款'],['退款记录',refund.length+' 笔',money(sum(refund))+' · 原付款金额']];$('recordSummary').innerHTML=items.map(([title,note,sub])=>'<div class="summary-item"><span>'+title+'</span><strong>'+note+'</strong><small>'+sub+'</small></div>').join('')+'<p class="summary-hint">金额仅汇总已填写金额的记录；累计打款不含失败和未打款。'+(unknown(all)?unknown(all)+'笔尚未填写金额，可点“修改”补充。':'')+'</p>'}function recordDate(t){return new Date(t).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai'})}function fmt(t){return t?new Date(t).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'—'}function save(){s.mode="days";try{localStorage.setItem(key,JSON.stringify(s))}catch{alert('保存失败，请立即导出备份。')}render()}function render(){$('appTitle').textContent=s.title||'付款额度';document.title=s.title||'付款额度';s.records.forEach(r=>{if(r.amount===undefined){let m=(r.note||'').match(/(?:^|[；;\s])(\d+(?:\.\d{1,2})?)元/);r.amount=m?Number(m[1]):null}if(r.status==='成功')r.status='已完成';if(r.status==='待确认')r.status='未打款';r.note=(r.note||'').replace(/[；;]?具体时间未提供/g,'').replace(/[；;]?付款结果待确认/g,'').replace(/[；;]?金额未提供/g,'')});let now=Date.now();$('mode').value=s.mode;$('zone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;$('cards').innerHTML=s.channels.map((c,i)=>{if(c.archived)return '';let a=stats(c,now);return `<div class=card><h2>${esc(c.name)}</h2><span class=num>${a.left}</span> 今日可付 <span class="quota-status ${a.left===0?'quota-empty':a.left===1?'quota-low':''}"><i class="status-dot" aria-hidden="true"></i>${a.left===0?'已用完':a.left===1?'余量较少':'可使用'}</span><p>今日 ${a.today}/${c.daily} · 30天 ${a.used}/${c.limit}${a.today>c.daily||a.used>c.limit?' · ⚠ 已超限':''}</p><p>下次滚动释放：${fmt(a.next)}</p><details><summary>调整限额</summary><label>30天上限 <input style="width:60px" type=number min=1 value=${c.limit} onchange="limit(${i},'limit',this)"></label><label>每日上限 <input style="width:60px" type=number min=1 value=${c.daily} onchange="limit(${i},'daily',this)"></label></details></div>`}).join('');renderRecordSummary();$('records').innerHTML='<table><tr><th>日期</th><th>渠道</th><th>金额</th><th>状态 / 备注</th><th>操作</th></tr>'+[...s.records].sort((a,b)=>b.time-a.time).map(r=>`<tr><td>${recordDate(r.time)}</td><td>${esc(s.channels.find(c=>c.id===r.channel)?.name||'')}</td><td>${Number.isFinite(r.amount)?money(r.amount):'—'}</td><td>${statusBadge(r.status)} <span class="record-note">${esc(r.note||'')}</span></td><td><button onclick="edit('${r.id}')">修改</button><button onclick="remove('${r.id}')">删除</button></td></tr>`).join('')+'</table>';document.querySelectorAll('.forecast-ranges button').forEach(b=>{let active=b.textContent==='未来'+forecastDays+'天';b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});let channels=s.channels.filter(c=>!c.archived).filter(c=>forecastGroup==='全部'||c.name.startsWith(forecastGroup));document.querySelectorAll('.forecast-tabs button').forEach(b=>{let active=b.textContent===forecastGroup;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});let dates=Array.from({length:forecastDays},(_,i)=>add(start(now),i+1));$('forecast').innerHTML='<table class="forecast-overview"><thead><tr><th>日期</th>'+channels.map(c=>'<th>'+esc(c.name)+'</th>').join('')+'</tr></thead><tbody>'+dates.map(t=>'<tr><td>'+new Date(t).toLocaleDateString('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric'})+'</td>'+channels.map(c=>'<td>'+stats(c,t).left+'</td>').join('')+'</tr>').join('')+'</tbody></table>'}function limit(i,k,input){let n=Number(input.value);if(!Number.isSafeInteger(n)||n<1){alert('请输入正整数');render();return}s.channels[i][k]=n;save()}function edit(id){editing=id||null;let r=s.records.find(r=>r.id===id);$('channel').innerHTML=s.channels.filter(c=>!c.archived||c.id===r?.channel).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('channel').value=r?.channel||s.channels.find(c=>!c.archived).id;let d=new Date(r?.time||Date.now());$('when').value=new Date(+d-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('status').value=r?.status||'已完成';$('note').value=r?.note||'';$('amount').value=r?.amount??'';$('dlg').showModal()}$('form').onsubmit=e=>{e.preventDefault();let time=+new Date($('when').value);if(!Number.isFinite(time)||time>Date.now()){alert('请输入有效的过去或当前时间');return}let r={id:editing||crypto.randomUUID(),channel:$('channel').value,time,status:$('status').value,note:$('note').value,amount:$('amount').value===''?null:Number($('amount').value)};if(r.amount!==null&&(!Number.isFinite(r.amount)||r.amount<0||r.amount>999999999)){alert('请输入有效金额');return}s.records=s.records.filter(x=>x.id!==editing);s.records.push(r);save();$('dlg').close();let c=s.channels.find(c=>c.id===r.channel),a=stats(c,time);if(r.status!=='未打款'&&(a.used>c.limit||a.today>c.daily))alert('已保存真实记录：该付款时间已超限，请停止继续付款。')};function remove(id){if(confirm('删除这笔记录？删除后额度会重新计算。')){s.records=s.records.filter(r=>r.id!==id);save()}}function download(text,name,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function backup(){download(JSON.stringify(s,null,2),'付款额度备份.json','application/json')}function csv(){let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';download('\ufeff'+[['时间','渠道','状态','金额（元）','备注'],...s.records.map(r=>[fmt(r.time),s.channels.find(c=>c.id===r.channel)?.name,r.status,r.amount??'',r.note])].map(row=>row.map(q).join(',')).join('\r\n'),'付款记录.csv','text/csv')}$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!['days','exact'].includes(v.mode)||!Array.isArray(v.channels)||!v.channels.length||!Array.isArray(v.records)||v.channels.some(c=>typeof c.id!=='string'||typeof c.name!=='string'||!Number.isSafeInteger(c.limit)||c.limit<1||!Number.isSafeInteger(c.daily)||c.daily<1)||v.records.some(r=>(r.amount!==undefined&&r.amount!==null&&(!Number.isFinite(r.amount)||r.amount<0||r.amount>999999999))||typeof r.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(r.id)||!Number.isFinite(r.time)||!v.channels.some(c=>c.id===r.channel)||!['成功','已完成','失败','退款','待确认','未打款'].includes(r.status)))throw Error();if(confirm('恢复将替换当前全部数据，建议先导出备份。继续？')){if(v.title!==undefined&&(typeof v.title!=='string'||!v.title.trim()||v.title.length>30))throw Error();v.mode='days';s=v;save()}}catch{alert('备份文件无效')}e.target.value=''};render();setInterval(render,30000);window.onfocus=render;
</script></html>
